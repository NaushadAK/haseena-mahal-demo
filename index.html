<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>Haseena Mahal Tailoring System</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
/* Layout: sticky top bar (role + branch switch) · left nav on desktop, bottom nav on phone · work area · slide-in "Questions for you" panel */
:root{
  --bg:#f3f2ee; --surface:#ffffff; --surface-2:#ebe9e3; --ink:#1c2230; --muted:#5d6472; --line:#d9d6cd;
  --accent:#0b4654; --accent-ink:#ffffff; --accent-soft:#dbe8eb; --thread:#7d5c00; --thread-soft:#fff1bf;
  --ok:#1d7440; --ok-soft:#dcefe2; --warn:#9a5f00; --warn-soft:#fbecd0; --bad:#b0281f; --bad-soft:#f8dedb; --info:#2c55a0; --info-soft:#dfe7f6;
  --shadow:0 1px 2px rgba(28,34,48,.06),0 6px 20px rgba(28,34,48,.06);
  --f-display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Figtree",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#14171d; --surface:#1c2028; --surface-2:#252a34; --ink:#e8e9ec; --muted:#a2a8b4; --line:#343a46;
  --accent:#ffcc07; --accent-ink:#1b1a12; --accent-soft:#3a3212; --thread:#ffd84d; --thread-soft:#3a3212;
  --ok:#66c98a; --ok-soft:#1b3326; --warn:#e8b04f; --warn-soft:#3b2e14; --bad:#f08077; --bad-soft:#3d1f1c; --info:#8fb0ee; --info-soft:#1d2a44;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#14171d; --surface:#1c2028; --surface-2:#252a34; --ink:#e8e9ec; --muted:#a2a8b4; --line:#343a46;
  --accent:#ffcc07; --accent-ink:#1b1a12; --accent-soft:#3a3212; --thread:#ffd84d; --thread-soft:#3a3212;
  --ok:#66c98a; --ok-soft:#1b3326; --warn:#e8b04f; --warn-soft:#3b2e14; --bad:#f08077; --bad-soft:#3d1f1c; --info:#8fb0ee; --info-soft:#1d2a44;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark;}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14.5px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--surface)}
h1,h2,h3{font-family:var(--f-display);font-weight:700;line-height:1.15;text-wrap:balance;margin:0}
h1{font-size:1.65rem} h2{font-size:1.2rem} h3{font-size:1rem}
button,select,input,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
.mono{font-family:var(--f-mono);font-size:.86em}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.85rem}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--surface);border-bottom:1px solid var(--line);
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;align-items:flex-start;gap:6px;min-width:0}
.brand b{font-family:var(--f-display);font-size:1.1rem;letter-spacing:.01em}
.brand .logo{height:52px;width:auto;max-width:100%;display:block}
.brand .logo.dk{display:none}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .brand .logo.lt{display:none}:root:not([data-theme="light"]) .brand .logo.dk{display:block}}
:root[data-theme="dark"] .brand .logo.lt{display:none}:root[data-theme="dark"] .brand .logo.dk{display:block}
.brand .sub{font-size:.75rem;color:var(--muted);border-left:1px solid var(--line);padding-left:10px;line-height:1.3}
.doclogo{height:44px;width:auto;display:block}
.slip .doclogo{height:34px;margin:0 auto 4px}
.brand small{display:block;color:var(--muted);font-size:.75rem;line-height:1}
.demo-pill{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;font-weight:700;background:var(--thread-soft);color:var(--thread);padding:3px 8px;border-radius:99px;white-space:nowrap}
.top .grow{flex:1}
.switch{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.switch label{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);display:flex;flex-direction:column;gap:2px}
.switch select{padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--surface);min-width:150px}
.qbtn{display:flex;align-items:center;gap:8px;border:1px solid var(--thread);background:var(--thread-soft);color:var(--thread);border-radius:10px;padding:8px 12px;font-weight:700;cursor:pointer}
.qbtn .cnt{background:var(--thread);color:var(--surface);border-radius:99px;padding:0 7px;font-size:.78rem}

.shell{display:grid;grid-template-columns:210px minmax(0,1fr);min-height:calc(100% - 64px)}
nav.side{border-right:1px solid var(--line);padding:14px 10px;position:sticky;top:104px;align-self:start;height:calc(100vh - 104px);overflow:auto;background:var(--bg)}
nav.side a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;color:var(--ink);text-decoration:none;font-weight:500;cursor:pointer}
nav.side a:hover{background:var(--surface-2)}
nav.side a.on{background:var(--accent);color:var(--accent-ink)}
nav.side a .ph{margin-left:auto;font-size:.66rem;font-weight:700;border:1px solid currentColor;border-radius:4px;padding:0 4px;opacity:.75}
nav.side svg{width:18px;height:18px;flex:none}
nav.side .sep{height:1px;background:var(--line);margin:10px 6px}
main{padding-block:22px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-width:0;max-width:1240px;width:100%}
@media (min-width:901px){main{padding-left:28px;padding-right:28px}}
.ph-head{display:flex;gap:12px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;margin-bottom:18px}
.ph-head p{margin:4px 0 0;color:var(--muted);max-width:68ch}
.eyebrow{font-size:.72rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:600}

/* generic */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
.panel + .panel{margin-top:16px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.between{justify-content:space-between}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 14px;cursor:pointer;font-weight:600;display:inline-flex;gap:6px;align-items:center;white-space:nowrap}
.btn:hover{border-color:var(--ink)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.pri:hover{filter:brightness(1.07)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.warn{border-color:var(--warn);color:var(--warn)}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.sm{padding:5px 10px;font-size:.85rem}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:.78rem;font-weight:600;padding:2px 9px;border-radius:99px;background:var(--surface-2);color:var(--ink);white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)} .chip.warn{background:var(--warn-soft);color:var(--warn)} .chip.bad{background:var(--bad-soft);color:var(--bad)} .chip.info{background:var(--info-soft);color:var(--info)} .chip.acc{background:var(--accent-soft);color:var(--accent)} .chip.thr{background:var(--thread-soft);color:var(--thread)}
.tag-ph{font-size:.68rem;font-weight:700;border:1px solid var(--thread);color:var(--thread);border-radius:4px;padding:0 5px;text-transform:uppercase;letter-spacing:.05em}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.74rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;background:var(--surface-2);white-space:nowrap}
tr:last-child td{border-bottom:0}
tr.click{cursor:pointer} tr.click:hover td{background:var(--surface-2)}
td.r,th.r{text-align:right}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field>span{font-size:.78rem;color:var(--muted);font-weight:600}
.field input,.field select,.field textarea{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface);width:100%}
.field textarea{min-height:64px;resize:vertical}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.note{border-left:3px solid var(--info);background:var(--info-soft);padding:10px 12px;border-radius:0 8px 8px 0;font-size:.9rem}
.note.warn{border-color:var(--warn);background:var(--warn-soft)}
.note.bad{border-color:var(--bad);background:var(--bad-soft)}
.note.ok{border-color:var(--ok);background:var(--ok-soft)}
.lock{display:flex;gap:10px;align-items:flex-start;border:1px dashed var(--bad);color:var(--bad);border-radius:10px;padding:10px 12px;background:var(--bad-soft);font-size:.9rem}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px;overflow-x:auto}
.tabs button{border:0;background:none;padding:9px 12px;cursor:pointer;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--ink);border-bottom-color:var(--accent)}
.empty{padding:24px;text-align:center;color:var(--muted)}

/* stat tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;margin-bottom:18px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;cursor:pointer;text-align:left}
.tile:hover{border-color:var(--ink)}
.tile .k{font-size:.78rem;color:var(--muted);font-weight:600}
.tile .v{font-family:var(--f-display);font-size:1.9rem;font-weight:700;line-height:1.1;margin-top:4px}
.tile .s{font-size:.8rem;color:var(--muted)}
.tile.bad .v{color:var(--bad)} .tile.warn .v{color:var(--warn)} .tile.ok .v{color:var(--ok)}

/* progress (the five quantities) */
.five{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.five div{background:var(--surface-2);border-radius:10px;padding:10px 12px}
.five .k{font-size:.74rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.five .v{font-family:var(--f-display);font-size:1.35rem;font-weight:700}
.five .a{font-size:.82rem;color:var(--muted)}
.bar{height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden;display:flex;min-width:80px}
.bar i{display:block;height:100%}

/* board */
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(220px,1fr);gap:12px;overflow-x:auto;padding-bottom:8px}
.col{background:var(--surface-2);border-radius:12px;padding:10px;min-height:200px;display:flex;flex-direction:column;gap:8px}
.col h3{font-size:.86rem;display:flex;justify-content:space-between;gap:6px;padding:2px 4px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 10px;cursor:pointer;font-size:.86rem;display:flex;flex-direction:column;gap:3px;position:relative}
.card:hover{border-color:var(--ink)}
.card.late{border-left:3px solid var(--bad)}
.card.sel{outline:2px solid var(--accent)}
.card .ref{font-family:var(--f-mono);font-size:.74rem;color:var(--muted)}
.card .cb{position:absolute;top:8px;right:8px;width:18px;height:18px}
.more{font-size:.8rem;color:var(--muted);text-align:center;padding:4px}
.bulkbar{position:sticky;bottom:12px;z-index:5;background:var(--ink);color:var(--bg);border-radius:12px;padding:10px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px;box-shadow:var(--shadow)}
.bulkbar select{background:var(--bg);color:var(--ink);border-radius:8px;border:0;padding:6px 8px}
.bulkbar .btn{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

/* wizard */
.steps{display:flex;gap:6px;margin-bottom:18px;flex-wrap:wrap}
.steps span{font-size:.82rem;font-weight:600;padding:5px 12px;border-radius:99px;background:var(--surface-2);color:var(--muted)}
.steps span.on{background:var(--accent);color:var(--accent-ink)}
.steps span.done{background:var(--accent-soft);color:var(--accent)}
.typecards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.typecard{border:1.5px solid var(--line);border-radius:14px;padding:18px;background:var(--surface);cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:6px}
.typecard:hover,.typecard.on{border-color:var(--accent)}
.typecard.on{background:var(--accent-soft)}
.typecard b{font-family:var(--f-display);font-size:1.1rem}
.line-card{border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--surface);display:flex;flex-direction:column;gap:10px}
.totals{display:grid;grid-template-columns:1fr auto;gap:4px 18px;font-variant-numeric:tabular-nums}
.totals .g{font-weight:700;font-size:1.1rem;border-top:1px solid var(--line);padding-top:6px}
.wiz-layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px;align-items:start}
.sticky{position:sticky;top:80px}
.mrow{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.mrow label{display:flex;flex-direction:column;font-size:.75rem;color:var(--muted);gap:2px}
.mrow input{border:1px solid var(--line);border-radius:7px;padding:6px 8px;background:var(--surface);width:100%}

/* documents (slip, labels, invoice) */
.paper{background:#fff;color:#16181d;border-radius:6px;padding:18px;box-shadow:var(--shadow);font-size:.88rem}
.paper h2,.paper h3{color:#16181d}
.paper table th{background:#f1f1ee;color:#555}
.paper table td,.paper table th{border-color:#ddd}
.paper .muted{color:#666}
.slip{max-width:300px;font-family:var(--f-mono);font-size:.78rem;padding:14px}
.slip hr{border:0;border-top:1px dashed #999;margin:8px 0}
.labels{display:flex;flex-wrap:wrap;gap:10px}
.qlabel{background:#fff;color:#111;border:1px solid #ccc;border-radius:6px;padding:8px;display:flex;gap:8px;align-items:center;width:230px;font-family:var(--f-mono);font-size:.72rem;line-height:1.3}
.qlabel b{font-size:.8rem}
[data-qr] img,[data-qr] canvas{display:block}

/* modal + drawer */
.overlay{position:fixed;inset:0;background:rgba(10,12,16,.45);z-index:80;display:flex;align-items:flex-start;justify-content:center;padding:max(24px,env(safe-area-inset-top,0px)) 12px 24px;overflow:auto}
.modal{background:var(--bg);border-radius:14px;width:100%;max-width:820px;box-shadow:0 20px 60px rgba(0,0,0,.3);display:flex;flex-direction:column;max-height:none}
.modal header{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;padding:16px 18px;border-bottom:1px solid var(--line);background:var(--surface);border-radius:14px 14px 0 0}
.modal .body{padding:16px 18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.modal footer{padding:12px 18px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;background:var(--surface);border-radius:0 0 14px 14px}
.x{border:0;background:var(--surface-2);border-radius:8px;width:32px;height:32px;cursor:pointer;font-size:1.1rem;flex:none}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(400px,100%);background:var(--surface);border-left:1px solid var(--line);z-index:70;box-shadow:-10px 0 40px rgba(0,0,0,.15);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.drawer header{padding:16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px}
.drawer .body{padding:16px;overflow:auto;display:flex;flex-direction:column;gap:14px;flex:1}
.q{border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px;background:var(--bg)}
.q p{margin:0;font-weight:600}
.q .hint{font-size:.82rem;color:var(--muted);font-weight:400}
.q .verdicts{display:flex;gap:6px;flex-wrap:wrap}
.q .verdicts button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:4px 10px;font-size:.8rem;font-weight:600;cursor:pointer}
.q .verdicts button.on.ok{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.q .verdicts button.on.chg{background:var(--warn);border-color:var(--warn);color:var(--surface)}
.q .verdicts button.on.no{background:var(--muted);border-color:var(--muted);color:var(--surface)}
.q textarea{border:1px solid var(--line);border-radius:8px;padding:7px 9px;background:var(--surface);min-height:44px;resize:vertical;width:100%}
.q.key{border-color:var(--thread)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:99;font-weight:600;max-width:calc(100% - 32px);box-shadow:var(--shadow)}
.welcome{background:linear-gradient(120deg,var(--accent-soft),var(--thread-soft));border-radius:14px;padding:16px 18px;margin-bottom:18px;display:flex;gap:16px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.welcome p{margin:4px 0 0;max-width:70ch}

/* scan phone */
.phone{width:min(330px,100%);border:10px solid var(--ink);border-radius:34px;background:var(--surface);overflow:hidden;margin:0 auto}
.cam{height:200px;background:#0f1418;position:relative;display:flex;align-items:center;justify-content:center;color:#9fb;font-size:.8rem}
.cam .frame{width:130px;height:130px;border:2px solid #4cbfa6;border-radius:12px;position:relative;overflow:hidden}
.cam .frame::after{content:"";position:absolute;left:0;right:0;height:2px;background:#4cbfa6;top:0;animation:scan 2s ease-in-out infinite}
@keyframes scan{50%{top:calc(100% - 2px)}}
@media (prefers-reduced-motion:reduce){.cam .frame::after{animation:none;top:50%}}
.phone .pbody{padding:14px;display:flex;flex-direction:column;gap:10px;min-height:260px}
.bigbtn{padding:14px;border-radius:12px;border:0;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:1rem;cursor:pointer}
.tagpile{display:flex;flex-wrap:wrap;gap:8px}
.tagpile button{border:1px dashed var(--line);background:var(--surface);border-radius:8px;padding:6px 8px;cursor:pointer;font-family:var(--f-mono);font-size:.74rem;text-align:left}
.tagpile button:hover{border-color:var(--accent)}
.sig{border:1px dashed var(--muted);border-radius:8px;background:#fff;touch-action:none;width:100%;height:120px;display:block}

.matrix td,.matrix th{text-align:center} .matrix td:first-child,.matrix th:first-child{text-align:left}
.yes{color:var(--ok);font-weight:700} .no{color:var(--muted)}
.hist li{margin-bottom:6px}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:4px 14px;font-size:.9rem}
.kv dt{color:var(--muted)} .kv dd{margin:0;min-width:0}

@media (max-width:900px){
  .shell{grid-template-columns:minmax(0,1fr)}
  nav.side{position:fixed;left:0;right:0;bottom:0;top:auto;height:auto;z-index:55;display:flex;overflow-x:auto;gap:2px;padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));border-right:0;border-top:1px solid var(--line);background:var(--surface)}
  nav.side a{flex-direction:column;gap:2px;font-size:.68rem;padding:6px 8px;min-width:64px;text-align:center}
  nav.side a .ph,nav.side .sep{display:none}
  main{padding-bottom:110px}
  .wiz-layout{grid-template-columns:minmax(0,1fr)}
  .sticky{position:static}
  .g2,.g3{grid-template-columns:minmax(0,1fr)}

const DOCLOGO=`<img class="doclogo" src="${LOGO.full}" alt="Haseena Mahal Tailors &amp; Uniforms">`;
const TODAY=new Date(); TODAY.setHours(12,0,0,0);
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const day=n=>addDays(TODAY,n);
const sd=d=>{const x=new Date(d);x.setHours(12,0,0,0);return x};
const dayDiff=(a,b)=>Math.round((sd(a)-sd(b))/864e5);
const r2=n=>Math.round((n+Number.EPSILON)*100)/100;
const sum=a=>a.reduce((s,x)=>s+(+x||0),0);
const money=n=>'AED '+(+n||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fd=d=>new Date(d).toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'});
const fdl=d=>new Date(d).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});

function seedStages(it,o,st){const f=FLOWS[flowOf(o)];const span=Math.max(1,dayDiff(TODAY,o.created));
  it.hist.push({stage:0,at:o.created,by:'—',entered:'Shabna K.'});
  for(let s=1;s<=st;s++){const k=f.keys[s];const by=k==='check'?(it.tailor||'—'):k==='done'?'—':(it.master||'—');
    it.hist.push({stage:s,at:addDays(o.created,Math.min(span-1,Math.max(0,Math.round(s*span/f.stages.length)))),by,entered:by==='—'?'Shabna K.':by,note:k==='stitch'&&it.tailor?'Assigned to '+it.tailor:''});

function recordPayment(o,amount,method,ref,date,user,kind){const p={id:'P'+(PAY.length+1),no:'RCT-'+String(++CTR.rct).padStart(5,'0'),orderId:o.id,amount:r2(amount),method,ref:ref||'',date,user:user||'Shabna K.',kind:kind||'payment',alloc:[]};PAY.push(p);o.log.push({at:date,user:p.user,text:`${kind==='advance'?'Advance':'Payment'} ${money(amount)} received (${method}) · ${p.no}`});notify(o,'payment',date,{amt:amount,rct:p.no});return p}
function allocateFree(o,inv){let due=invDue(inv);PAY.filter(p=>p.orderId===o.id).forEach(p=>{const free=r2(p.amount-sum(p.alloc.map(a=>a.amount)));if(free>0&&due>0){const a=r2(Math.min(free,due));p.alloc.push({invId:inv.id,amount:a});due=r2(due-a)}})}
function createInvoice(o,items,date,user,forceFull){const comp=o.compId?CO(o.compId):null;const net=r2(sum(items.map(i=>i.price)));const disc=r2(net*(o.discountPct||0)/100);const taxable=r2(net-disc);const vat=r2(taxable*VAT);const total=r2(taxable+vat);
  const type=forceFull||(comp&&comp.trn)||total>SIMPLIFIED_LIMIT?'full':'simplified';const no='INV-2026-'+String(++CTR.inv).padStart(6,'0');
  const g={};items.forEach(i=>{const k=i.label+'|'+i.price;g[k]=g[k]||{desc:i.label,rate:i.price,qty:0};g[k].qty++});
  const lines=Object.values(g).map(l=>{const n=r2(l.qty*l.rate*(1-(o.discountPct||0)/100));return {...l,net:n,vat:r2(n*VAT),total:r2(n*1.05)}});
  const inv={id:'I'+(INV.length+1),no,date,orderId:o.id,type,itemIds:items.map(i=>i.id),lines,net,disc,taxable,vat,total,status:'issued',po:o.po,user:user||'Mini Joseph',einv:type==='full'&&comp?{st:'Accepted',ref:'AE-'+String(Math.abs(no.split('').reduce((h,c)=>h*31+c.charCodeAt(0)|0,7))).slice(0,10)}:null};
  INV.push(inv);items.forEach(i=>i.invoiceId=inv.id);allocateFree(o,inv);o.log.push({at:date,user:inv.user,text:`${type==='full'?'Tax invoice':'Simplified tax invoice'} ${no} issued for ${items.length} item(s), ${money(total)}`});
  AUDIT.push({at:date,user:inv.user,what:'Invoice issued',ref:no,old:'—',nw:money(total)});return inv}
const invPaid=inv=>r2(sum(PAY.flatMap(p=>p.alloc.filter(a=>a.invId===inv.id).map(a=>a.amount))));
const invCredited=inv=>r2(sum(CN.filter(c=>c.invId===inv.id).map(c=>c.amount)));
const invDue=inv=>inv.status==='cancelled'?0:r2(inv.total-invPaid(inv)-invCredited(inv));

  const d={id:'D'+(DEL.length+1),no,orderId:o.id,date,itemIds:items.map(i=>i.id),recipient:rec.name,mobile:rec.mobile||'',signed:!!rec.signed,user:user||'Shabna K.',branch:o.collect};DEL.push(d);

function ofig(o){const its=o.items.filter(i=>!i.cancelled);const f=FLOWS[flowOf(o)];const net=r2(sum(its.map(i=>itemNet(i,o))));const total=r2(net*(1+VAT));

Object.assign(IC,{'m-cut':IC.production,'m-assign':'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.5 3.4-5.5 6.5-5.5"/><path d="M14 16l3 3 5-6"/>','m-check':'<circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.5 2.5L16 9.5"/>','m-team':IC.customers,'t-work':'<path d="M4 20L18 6"/><ellipse cx="19" cy="5" rx="1.6" ry="2.6" transform="rotate(45 19 5)"/><path d="M4 20c3-1 2-5 6-5"/>','t-done':'<circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.5 2.5L16 9.5"/>'});

/* ---------------- shell ---------------- */
function renderTop(){const u=U();const done=Object.values(S.review).filter(r=>r&&r.v).length;
  document.getElementById('top').innerHTML=`
  <div class="brand"><img class="logo lt" src="${LOGO.full}" alt="Haseena Mahal Tailors &amp; Uniforms"><img class="logo dk" src="${LOGO.dark}" alt="Haseena Mahal Tailors &amp; Uniforms"><span class="demo-pill">Sample data · demo</span></div>
  <div class="grow"></div>
  <div class="switch">
    <label for="roleSel">Signed in as<select id="roleSel" data-ch="role">${Object.values(USERS).map(x=>`<option value="${x.key}" ${x.key===S.role?'selected':''}>${esc(x.name)} · ${esc(x.role)}</option>`).join('')}</select></label>
    ${u.phone?"":`<label for="brSel">Branch<select id="brSel" data-ch="branch">${u.branches.length>1?`<option value="ALL" ${S.branch==='ALL'?'selected':''}>All my branches (${u.branches.length})</option>`:''}${u.branches.map(b=>`<option value="${b}" ${S.branch===b?'selected':''}>${esc(bn(b))}</option>`).join('')}</select></label>`}
  </div>
  <button class="qbtn" data-a="drawer">Questions for you <span class="cnt">${done}/${QS.length}</span></button>`}
function renderNav(){const pr=PR();const cnt=navCounts();
  document.getElementById('nav').innerHTML=pr.nav.map(k=>NAV.find(n=>n[0]===k)).filter(Boolean).map(([k,l])=>`<a data-a="go" data-r="${k}" class="${S.route===k||(k==='orders'&&S.route==='order')?'on':''}">${ico(k)}<span>${l}</span>${cnt[k]?`<span class="badge">${cnt[k]}</span>`:''}</a>`).join('')+
  (U().phone?'':`<div class="sep"></div><a data-a="go" data-r="review" class="${S.route==='review'?'on':''}">${ico('review')}<span>Decisions</span></a>`)}
function render(){const ae=document.activeElement;const fid=ae&&ae.id;let ss=null,se=null;try{ss=ae.selectionStart;se=ae.selectionEnd}catch(e){}
  if(U().phone&&!PR().nav.includes(S.route)&&S.route!=='review'&&S.route!=='order')S.route=PR().nav[0];document.body.classList.toggle('phone-mode',!!U().phone);renderTop();renderNav();const m=document.getElementById('main');m.innerHTML=(VIEWS[S.route]||VIEWS.home)();renderLayer();
  if(fid){const el=document.getElementById(fid);if(el&&el!==document.activeElement&&(el.tagName==='INPUT'||el.tagName==='TEXTAREA')){el.focus();try{if(ss!=null)el.setSelectionRange(ss,se)}catch(e){}}}
  afterRender()}
function afterRender(){document.querySelectorAll('[data-qr]').forEach(el=>{if(el.dataset.done)return;el.dataset.done=1;const sz=+el.dataset.size||76;if(window.QRCode){try{new QRCode(el,{text:el.dataset.qr,width:sz,height:sz,colorDark:'#111111',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.M})}catch(e){el.textContent='QR'}}else{el.style.cssText=`width:${sz}px;height:${sz}px;background:repeating-conic-gradient(#111 0 25%,#fff 0 50%) 0 0/12px 12px`}});
  const c=document.getElementById('sig');if(c&&!c.dataset.on)initSig(c)}
let toastT;function toast(t){let el=document.getElementById('toast');if(!el){el=document.createElement('div');el.id='toast';el.className='toast';el.setAttribute('role','status');document.body.appendChild(el)}el.textContent=t;el.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>el.hidden=true,3200)}
const head=(eb,title,sub,actions)=>`<div class="ph-head"><div><div class="eyebrow">${eb}</div><h1>${title}</h1>${sub?`<p>${sub}</p>`:''}</div><div class="row">${actions||''}</div></div>`;
const lock=t=>`<div class="lock"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg><div>${t}</div></div>`;
function stageChip(it,o){const f=FLOWS[flowOf(o)];if(it.cancelled)return '<span class="chip">Cancelled</span>';const k=f.keys[it.stage];let cls=STAGE_CLS[k]||'';if(isOverdue(it,o))cls='bad';
  return `<span class="chip ${cls}">${esc(f.stages[it.stage])}</span>${it.reworkOpen?' <span class="chip bad">Rework</span>':''}${it.transit?' <span class="chip info">In transit</span>':''}`}
function progressBar(fg){const w=x=>fg.n?Math.round(100*x/fg.n):0;return `<div class="bar" title="${fg.del} delivered, ${fg.comp-fg.del} ready, ${fg.n-fg.comp} in work"><i style="width:${w(fg.del)}%;background:var(--ok)"></i><i style="width:${w(fg.comp-fg.del)}%;background:var(--accent)"></i></div>`}

/* ---------------- views ---------------- */
const VIEWS={};
VIEWS.home=()=>{const u=U();const its=visItems();const today=its.filter(({i,o})=>!i.deliveryId&&dayDiff(i.due,TODAY)===0);const over=its.filter(({i,o})=>isOverdue(i,o));const ready=its.filter(({i,o})=>isReady(i,o));
  const fits=visOrders().filter(o=>o.fitting&&dayDiff(o.fitting.at,TODAY)===0);const unpaid=visOrders().map(o=>({o,f:ofig(o)})).filter(x=>x.f.balance>0.009&&x.f.del>0);const transit=its.filter(({i})=>i.transit);
  const appr=visOrders().filter(o=>o.approval&&o.approval.status==='pending');
  const welcome=S.welcome?`<div class="welcome"><div><h2>Welcome to the demo</h2><p>This shows how the system would work at Haseena Mahal, with sample customers and orders. <b>Switch "Signed in as" at the top</b> to see what Sales, the Accountant, a Branch admin, Management, a Master and a Tailor would each see. Masters and tailors get screens made for their phones. When something should work differently, press <b>Questions for you</b> and note it.</p></div><button class="btn sm" data-a="hideWelcome">Got it</button></div>`:'';
  if(S.role==='management')return welcome+homeMgmt(over,ready,appr);
  if(S.role==='accountant')return welcome+homeAcct();
  if(S.role==='tailor'){const mine=its.filter(({i})=>!i.deliveryId);return welcome+head('My work',`Good day, ${u.name}`,'Only the garments assigned to you are shown.')+`<div class="tiles">${tile('Assigned to me',mine.length,'','go','production')}${tile('Late',mine.filter(({i,o})=>isOverdue(i,o)).length,'bad','go','production')}${tile('In rework',mine.filter(({i})=>i.reworkOpen).length,'warn','go','production')}</div>`+itemList(mine.slice(0,12),'My garments')}
  return welcome+head(bn(myBranches()[0])+(myBranches().length>1?' + more':'')+' branch · '+fd(TODAY),`Today at a glance`,'What needs action today. Tap any number to see the garments behind it.',PR().nav.includes('new-order')?`<button class="btn pri" data-a="go" data-r="new-order">+ New order</button>`:'')+
  `<div class="tiles">${tile('Due today',today.length,'','prod','today')}${tile('Overdue',over.length,'bad','prod','overdue')}${tile('Ready for collection',ready.length,'ok','go','deliveries')}${tile('Fittings today',fits.length,'','none','')}${tile('Unpaid after delivery',unpaid.length,'warn','go','billing',money(sum(unpaid.map(x=>x.f.balance))))}${tile('In transit',transit.length,'','prod','')}${tile('Waiting for a master',its.filter(({i,o})=>['tocut','wait'].includes(SKEY(i,o))&&!i.master).length,'','prod','queue')}${PR().stock?tile('Low stock',lowStock().length,'warn','go','stock','items below minimum'):''}</div>`+
  (appr.length?`<div class="panel" style="border-color:var(--warn)"><h3>Discount waiting for approval</h3>${appr.map(o=>`<div class="row between" style="margin-top:10px"><div><span class="mono">${o.ref}</span> · ${esc(partyName(o))} · <b>${o.approval.pct}%</b> requested by ${esc(o.approval.by)} · <span class="muted">${esc(o.approval.reason)}</span></div>${PR().approve?`<div class="row"><button class="btn sm pri" data-a="approve" data-o="${o.id}">Approve</button><button class="btn sm" data-a="reject" data-o="${o.id}">Reject</button></div>`:'<span class="chip warn">Waiting for Branch admin</span>'}</div>`).join('')}</div>`:'')+
  `<div class="grid g2" style="margin-top:16px">${itemList(over.sort((a,b)=>a.i.due-b.i.due),'Overdue — oldest first',true)}<div class="panel"><h3>Fittings today</h3>${fits.length?fits.map(o=>`<div class="row between" style="margin-top:10px"><div><b>${o.fitting.time}</b> · ${esc(partyName(o))}<div class="small muted">${esc(o.fitting.note)} · <span class="mono">${o.ref}</span></div></div><button class="btn sm" data-a="openOrder" data-o="${o.id}">Open</button></div>`).join(''):'<p class="muted">No fittings today.</p>'}
  <h3 style="margin-top:18px">Ready for collection</h3>${ready.length?ready.slice(0,6).map(({i,o})=>`<div class="row between" style="margin-top:8px"><div><span class="mono small">${itemRef(i)}</span> ${esc(i.label)}<div class="small muted">${esc(itemWho(i))}</div></div><button class="btn sm" data-a="openOrder" data-o="${o.id}">Open</button></div>`).join('')+(ready.length>6?`<p class="small muted">+ ${ready.length-6} more</p>`:''):'<p class="muted">Nothing waiting.</p>'}</div></div>`};
function tile(k,v,cls,a,arg,s){return `<button class="tile ${cls}" data-a="${a}" data-r="${arg}" data-f="${arg}"><div class="k">${k}</div><div class="v num">${v}</div>${s?`<div class="s num">${s}</div>`:''}</button>`}
function itemList(arr,title,showLate){return `<div class="panel"><h3>${title}</h3>${arr.length?`<div class="tbl-wrap" style="margin-top:10px"><table><tr><th>Garment</th><th>Stage</th><th>${showLate?'Late':'Due'}</th></tr>${arr.slice(0,10).map(({i,o})=>`<tr class="click" data-a="item" data-i="${i.id}"><td><span class="mono small muted">${itemRef(i)}</span><br>${esc(i.label)} <span class="small muted">· ${esc(itemWho(i))}</span></td><td>${stageChip(i,o)}</td><td class="num">${showLate?`<b style="color:var(--bad)">${-dayDiff(i.due,TODAY)} days</b>`:fd(i.due)}</td></tr>`).join('')}</table></div>${arr.length>10?`<p class="small muted">+ ${arr.length-10} more on the production board</p>`:''}`:'<p class="muted">Nothing here. Good.</p>'}</div>`}
function homeMgmt(over,ready,appr){const rows=BR.map(b=>{const os=ORD.filter(o=>o.branch===b.id);const its=os.flatMap(o=>o.items.filter(i=>!i.cancelled).map(i=>({i,o})));const rev=sum(INV.filter(v=>v.status!=='cancelled'&&ORDBY(v.orderId).branch===b.id).map(v=>v.taxable));const bal=sum(os.map(o=>{const f=ofig(o);return f.del?Math.max(0,f.balance):0}));
  return {b,open:os.filter(o=>ofig(o).open).length,over:its.filter(x=>isOverdue(x.i,x.o)).length,ready:its.filter(x=>isReady(x.i,x.o)).length,del:its.filter(x=>x.i.deliveryId&&dayDiff(DEL.find(d=>d.id===x.i.deliveryId).date,TODAY)>-30).length,rev,bal}});
  const mx=Math.max(...rows.map(r=>r.rev),1);
  return head('All 7 branches · '+fd(TODAY),'Management overview','Compare branches on one screen. Tap a branch name to switch to it.')+
  `<div class="tiles">${tile('Open orders',sum(rows.map(r=>r.open)),'','go','orders')}${tile('Overdue garments',sum(rows.map(r=>r.over)),'bad','go','reports')}${tile('Ready, not collected',sum(rows.map(r=>r.ready)),'ok','go','deliveries')}${tile('Sales this month (ex VAT)',money(sum(rows.map(r=>r.rev))).replace('AED ',''),'','go','reports','AED')}${tile('Owed by customers',money(sum(rows.map(r=>r.bal))).replace('AED ',''),'warn','go','billing','AED, delivered but unpaid')}</div>
  <div class="tbl-wrap"><table><tr><th>Branch</th><th class="r">Open orders</th><th class="r">Overdue</th><th class="r">Ready</th><th class="r">Delivered (30 d)</th><th>Sales this month</th><th class="r">Owed</th></tr>${rows.map(r=>`<tr><td><a data-a="pickBranch" data-b="${r.b.id}" style="cursor:pointer;font-weight:600">${r.b.name}</a></td><td class="r">${r.open}</td><td class="r" style="${r.over?'color:var(--bad);font-weight:700':''}">${r.over}</td><td class="r">${r.ready}</td><td class="r">${r.del}</td><td><div class="row" style="flex-wrap:nowrap"><div class="bar" style="width:120px"><i style="width:${Math.round(100*r.rev/mx)}%;background:var(--accent)"></i></div><span class="num small">${money(r.rev)}</span></div></td><td class="r">${money(r.bal)}</td></tr>`).join('')}</table></div>
  ${appr.length?`<div class="panel" style="margin-top:16px;border-color:var(--warn)"><h3>Approvals waiting</h3>${appr.map(o=>`<div class="row between" style="margin-top:8px"><span><span class="mono">${o.ref}</span> · ${o.approval.pct}% discount · ${esc(o.approval.reason)}</span><div class="row"><button class="btn sm pri" data-a="approve" data-o="${o.id}">Approve</button><button class="btn sm" data-a="reject" data-o="${o.id}">Reject</button></div></div>`).join('')}</div>`:''}`}
function homeAcct(){const invs=INV.filter(v=>myBranches().includes(ORDBY(v.orderId).branch));const open=invs.filter(v=>invDue(v)>0.009);const advFree=sum(visOrders().map(o=>ofig(o).advFree));const delNotInv=visOrders().flatMap(o=>o.items.filter(i=>i.deliveryId&&!i.invoiceId));
  return head('Accounts · '+fd(TODAY),'Billing at a glance','Delivered garments not yet invoiced, unpaid invoices and advances held.')+
  `<div class="tiles">${tile('Delivered, not invoiced',delNotInv.length,'warn','go','billing','garments')}${tile('Unpaid invoices',open.length,'bad','go','billing',money(sum(open.map(invDue))))}${tile('Advances not yet used',money(advFree).replace('AED ',''),'','go','billing','AED held for future invoices')}${tile('Invoices this month',invs.length,'','go','billing')}</div>`+billInvoices(open,'Unpaid invoices')}

/* ---- customers ---- */
VIEWS.customers=()=>{const tab=S.custTab;if(S.custId)return custDetail();if(S.compId)return compDetail();
  const q=S.custQ.trim().toLowerCase().replace(/\s/g,'');const list=CUST.filter(c=>!q||c.name.toLowerCase().replace(/\s/g,'').includes(q)||c.mobile.replace(/\s/g,'').includes(q));
  return head('Shared by all branches','Customers & measurements','A customer registered at one branch can be found at every branch by mobile number.',`<button class="btn pri" data-a="newCust">+ New customer</button>`)+
  `<div class="tabs"><button class="${tab==='customers'?'on':''}" data-a="custTab" data-t="customers">Walk-in customers</button><button class="${tab==='companies'?'on':''}" data-a="custTab" data-t="companies">Companies (uniforms)</button></div>`+
  (tab==='customers'?`<div class="field" style="max-width:360px;margin-bottom:12px"><span>Search by mobile or name</span><input id="custQ" data-in="custQ" value="${esc(S.custQ)}" placeholder="e.g. 050 412 or Fathima"></div>
  <div class="tbl-wrap"><table><tr><th>Name</th><th>Mobile</th><th>Family members</th><th>First registered</th><th class="r">Open orders</th></tr>${list.map(c=>`<tr class="click" data-a="openCust" data-c="${c.id}"><td><b>${esc(c.name)}</b></td><td class="mono">${c.mobile}</td><td>${c.members.length}</td><td>${bn(c.branch)}</td><td class="r">${ORD.filter(o=>o.custId===c.id&&ofig(o).open).length}</td></tr>`).join('')}</table></div>`
  :`<div class="tbl-wrap"><table><tr><th>Company</th><th>TRN</th><th>Employees</th><th>Payment terms</th><th>Contract prices</th></tr>${COMP.map(c=>`<tr class="click" data-a="openComp" data-c="${c.id}"><td><b>${esc(c.name)}</b></td><td class="mono">${c.trn}</td><td>${c.employees.length}</td><td>${c.terms}</td><td class="small">${Object.entries(c.contract).map(([g,p])=>GAR[g].name+' '+money(p)).join(' · ')}</td></tr>`).join('')}</table></div>`)};
function custDetail(){const c=CU(S.custId);const m=c.members.find(x=>x.id===S.memberId)||c.members[0];const os=ORD.filter(o=>o.custId===c.id);const bal=sum(os.map(o=>ofig(o).balance));
  return `<button class="btn ghost sm" data-a="back">← Customers</button>`+head('Customer · registered at '+bn(c.branch),esc(c.name),`<span class="mono">${c.mobile}</span>${c.email?' · '+esc(c.email):''} · customer since ${c.since}`,`<button class="btn pri" data-a="orderFor" data-c="${c.id}">+ New order</button>`)+
  `<div class="grid g2"><div class="panel"><div class="row between"><h3>Family members & measurements</h3><button class="btn sm" data-a="addMember">+ Add member</button></div>
  <div class="tabs" style="margin-top:10px">${c.members.map(x=>`<button class="${x.id===m.id?'on':''}" data-a="member" data-m="${x.id}">${esc(x.name)}</button>`).join('')}</div>
  ${Object.keys(m.meas).length?Object.entries(m.meas).map(([g,sets])=>`<div style="margin-bottom:14px"><div class="row between"><b>${GAR[g].name}</b><button class="btn sm" data-a="editMeas" data-g="${g}">Take new measurements</button></div>
    <div class="tbl-wrap" style="margin-top:6px"><table><tr><th>Taken</th>${GAR[g].form.map(f=>`<th class="r">${f}</th>`).join('')}</tr>${sets.map((s,k)=>`<tr${k?' style="color:var(--muted)"':''}><td class="small">${fdl(s.date)}<br>${esc(s.by)}${k?'':' <span class="chip acc">current</span>'}</td>${GAR[g].form.map(f=>`<td class="r num">${s.values[f]}</td>`).join('')}</tr>`).join('')}</table></div></div>`).join(''):'<p class="muted">No measurements yet. They are taken when the first order is created.</p>'}
  <p class="small muted">Measurements in inches (to confirm). Older sets are kept as history. Orders keep a copy of the measurements used, so new measurements never change a job already in work.</p></div>
  <div class="panel"><div class="row between"><h3>Orders</h3><span class="chip ${bal>0?'warn':'ok'}">Balance ${money(bal)}</span></div>${os.length?`<div class="tbl-wrap" style="margin-top:10px"><table><tr><th>Order</th><th>Status</th><th class="r">Balance</th></tr>${os.map(o=>{const f=ofig(o);return `<tr class="click" data-a="openOrder" data-o="${o.id}"><td><span class="mono">${o.ref}</span><br><span class="small muted">${TYPES[o.type]} · ${fd(o.created)}</span></td><td>${progressBar(f)}<span class="small muted">${f.del}/${f.n} delivered</span></td><td class="r num">${money(f.balance)}</td></tr>`}).join('')}</table></div>`:'<p class="muted">No orders yet.</p>'}</div></div>`}
function compDetail(){const c=CO(S.compId);const os=ORD.filter(o=>o.compId===c.id);
  return `<button class="btn ghost sm" data-a="back">← Companies</button>`+head('Company · uniform client',esc(c.name),`TRN <span class="mono">${c.trn}</span> · ${esc(c.address)} · ${esc(c.contact)}, ${c.phone} · Terms ${c.terms}`,`<button class="btn" data-a="importEmp">Import employees from Excel</button><button class="btn pri" data-a="orderFor" data-comp="${c.id}">+ New uniform order</button>`)+
  `<div class="grid g2"><div class="panel"><h3>Employees (${c.employees.length})</h3><p class="small muted">Some employees are measured individually, others choose a size from the size chart.</p><div class="tbl-wrap" style="max-height:420px;overflow:auto"><table><tr><th>ID</th><th>Name</th><th>Department</th><th>Fit by</th></tr>${c.employees.map(e=>`<tr><td class="mono small">${e.id}</td><td>${esc(e.name)}</td><td>${e.dept}</td><td>${e.mode==='size'?`<span class="chip">Size ${e.size}</span>`:'<span class="chip acc">Measured</span>'}</td></tr>`).join('')}</table></div></div>
  <div class="panel"><h3>Orders & quotations</h3>${os.map(o=>{const f=ofig(o);return `<div class="row between" style="margin-top:10px"><div><span class="mono">${o.ref}</span> · PO ${esc(o.po)}<div class="small muted">${f.del}/${f.n} garments delivered · balance ${money(f.balance)}</div></div><button class="btn sm" data-a="openOrder" data-o="${o.id}">Open</button></div>`}).join('')}${QUO.filter(q=>q.compId===c.id).map(q=>`<div class="row between" style="margin-top:10px"><div><span class="mono">${q.no}</span> quotation · <span class="chip ${q.status==='converted'?'ok':'info'}">${q.status}</span></div><button class="btn sm" data-a="openQuote" data-q="${q.id}">View</button></div>`).join('')}
  <h3 style="margin-top:18px">Contract prices</h3><p>${Object.entries(c.contract).map(([g,p])=>`${GAR[g].name}: <b>${money(p)}</b> <span class="small muted">(list ${money(GAR[g].price)})</span>`).join('<br>')}</p></div></div>`}

/* ---- new order wizard ---- */
function wizInit(p){S.wiz={step:p&&p.type?2:1,type:p&&p.type||null,custId:p&&p.custId||null,compId:p&&p.compId||null,memberId:null,lines:[],promised:isoD(day(7)),collect:U().branches[0]==='WS'?'KAR':U().branches[0],po:'',advance:'',advMethod:'Cash',notes:'',discount:0,urgent:false,custQ:'',quote:p&&p.quote||null}}
VIEWS['new-order']=()=>{if(!PR().nav.includes('new-order'))return lock('Your role cannot create orders.');if(S.justCreated)return createdView();if(!S.wiz)wizInit();const w=S.wiz;
  const steps=['Type of work','Customer','Garments','Delivery & advance'];
  return head('Branch: '+bn(w.collect),'New order','Intake at the counter. Prices come from the price list automatically.')+
  `<div class="steps">${steps.map((s,i)=>`<span class="${w.step===i+1?'on':w.step>i+1?'done':''}">${i+1}. ${s}</span>`).join('')}</div>`+[null,wiz1,wiz2,wiz3,wiz4][w.step]()};
function wiz1(){const w=S.wiz;const T=[['alteration','Alteration','Customer brings their own garment to change. Photo and condition recorded at intake.'],['mtm','Made-to-measure','New garment stitched to the customer\'s or a family member\'s measurements.'],['uniform','Uniform order','Company order for many employees, from a quotation. Partial delivery and billing.']];

function newMtmLine(c){const w=S.wiz;const mem=c.members.find(m=>m.id===w.memberId)||c.members[0];const g=Object.keys(mem.meas).find(k=>!GAR[k].uniform)||'kandura';return mtmLineFor(mem,g)}

VIEWS.order=()=>{const o=ORDBY(S.orderId);if(!o)return VIEWS.orders();if(!canSeeOrder(o))return lock('This order belongs to another branch.');const f=ofig(o);const fl=FLOWS[flowOf(o)];const pr=PR();

function billInvoices(invs,title,compact){return `${title?`<h3 style="margin:12px 0 8px">${title}</h3>`:''}<div class="tbl-wrap"><table><tr><th>Invoice</th><th>Date</th>${compact?'':'<th>Customer</th>'}<th>Type</th><th class="r">Total</th><th class="r">Due</th><th></th></tr>${invs.slice().reverse().map(v=>{const o=ORDBY(v.orderId);return `<tr><td class="mono">${v.no}${v.status==='cancelled'?' <span class="chip bad">cancelled</span>':''}</td><td>${fd(v.date)}</td>${compact?'':`<td>${esc(partyName(o))}<div class="small muted mono">${o.ref}</div></td>`}<td>${v.type==='full'?'<span class="chip info">Tax invoice</span>':'<span class="chip">Simplified</span>'}${v.einv?' <span class="chip ok">e-invoice ✓</span>':''}</td><td class="r num">${money(v.total)}</td><td class="r num">${invDue(v)>0?`<b style="color:var(--warn)">${money(invDue(v))}</b>`:'<span class="chip ok">paid</span>'}</td><td><button class="btn sm" data-a="viewInv" data-v="${v.id}">View</button></td></tr>`}).join('')||'<tr><td colspan="7" class="empty">None.</td></tr>'}</table></div>`}
VIEWS.billing=()=>{const pr=PR();const tab=S.billTab;const mine=v=>myBranches().includes(ORDBY(v.orderId).branch);const invs=INV.filter(mine);const pays=PAY.filter(p=>myBranches().includes(ORDBY(p.orderId).branch));const cns=CN.filter(c=>mine(INV.find(v=>v.id===c.invId)));

  `<div class="tabs">${[['invoices','Invoices'],['toinvoice',`To invoice (${toInv.length})`],['payments','Payments & advances'],['credit','Credit notes'],['statements','Customer balances']].map(([k,l])=>`<button class="${tab===k?'on':''}" data-a="billTab" data-t="${k}">${l}</button>`).join('')}</div>`+

  (tab==='credit'?`${pr.creditNote?'':lock('Your role cannot issue credit notes. Only the Accountant and Management can.')}<div class="tbl-wrap" style="margin-top:12px"><table><tr><th>Credit note</th><th>Date</th><th>Against invoice</th><th>Reason</th><th class="r">Amount</th><th>By</th></tr>${cns.map(c=>`<tr><td class="mono">${c.no}</td><td>${fd(c.date)}</td><td class="mono">${INV.find(v=>v.id===c.invId).no}</td><td>${esc(c.reason)}</td><td class="r num">${money(c.amount)}</td><td>${esc(c.user)}</td></tr>`).join('')||'<tr><td colspan="6" class="empty">None.</td></tr>'}</table></div>`:'')+
  (tab==='statements'?statements(invs):'')};
function statements(invs){const parties={};invs.filter(v=>invDue(v)>0.009).forEach(v=>{const o=ORDBY(v.orderId);const k=o.compId||o.custId;const p=parties[k]=parties[k]||{name:partyName(o),b:[0,0,0,0]};const age=-dayDiff(v.date,TODAY);p.b[age<=30?0:age<=60?1:age<=90?2:3]+=invDue(v)});

function invoiceModal(oid){const o=ORDBY(oid);const m=S.modal;const elig=o.items.filter(i=>i.deliveryId&&!i.invoiceId);m.sel=m.sel||new Set(elig.map(i=>i.id));const notDel=o.items.filter(i=>!i.deliveryId&&!i.cancelled);
  const net=r2(sum([...m.sel].map(id=>ITEM(id).price)));const disc=r2(net*(o.discountPct||0)/100);const vat=r2((net-disc)*VAT);const total=r2(net-disc+vat);const comp=o.compId?CO(o.compId):null;const type=(comp&&comp.trn)||total>SIMPLIFIED_LIMIT?'full':'simplified';const adv=ofig(o).advFree;
  return modal(`<div><div class="eyebrow">New invoice</div><h2>${o.ref} · ${esc(partyName(o))}</h2></div>`,
  `<div class="tbl-wrap" style="max-height:300px;overflow:auto"><table>${elig.map(i=>`<tr><td><input type="checkbox" data-a="invSel" data-i="${i.id}" ${m.sel.has(i.id)?'checked':''} aria-label="select"></td><td>${esc(i.label)} <span class="small muted">${esc(itemWho(i))}</span></td><td><span class="chip ok">delivered</span></td><td class="r num">${money(i.price)}</td></tr>`).join('')}${notDel.length?`<tr><td><input type="checkbox" disabled aria-label="not delivered"></td><td colspan="3" class="muted">${notDel.length} garment(s) not delivered yet — they cannot be invoiced.</td></tr>`:''}</table></div>
  <div class="grid g2"><div class="note ${type==='full'?'':'ok'}"><b>${type==='full'?'Full tax invoice':'Simplified tax invoice'}</b><br><span class="small">${type==='full'?(comp?'Company with a TRN, so a full tax invoice is required.':'Over AED 10,000.'):'Walk-in customer under AED 10,000.'} Chosen automatically.</span></div>
  <div class="totals"><span>Subtotal</span><span>${money(net)}</span>${disc?`<span>Discount ${o.discountPct}%</span><span>− ${money(disc)}</span>`:''}<span>VAT 5%</span><span>${money(vat)}</span><span class="g">Invoice total</span><span class="g">${money(total)}</span><span>Advance applied</span><span>− ${money(Math.min(adv,total))}</span><span><b>Left to pay</b></span><span><b>${money(Math.max(0,total-adv))}</b></span></div></div>`,
  `<button class="btn" data-a="close">Cancel</button><button class="btn pri" data-a="confirmInvoice" data-o="${o.id}" ${m.sel.size?'':'disabled'}>Issue invoice</button>`)}
function invView(vid){const v=INV.find(x=>x.id===vid);const o=ORDBY(v.orderId);const comp=o.compId?CO(o.compId):null;const pr=PR();const cn=CN.find(c=>c.invId===v.id);
  return modal(`<h2>${v.type==='full'?'Tax invoice':'Simplified tax invoice'} ${v.no}</h2>`,
  `${v.status==='cancelled'?`<div class="note bad">Cancelled. The number is kept. Credit note <b>${cn?cn.no:''}</b> was issued.</div>`:''}<div class="paper"><div class="row between" style="align-items:flex-start"><div>${DOCLOGO}<div class="small muted" style="margin-top:6px">${bn(o.branch)}, Dubai, UAE<br>TRN 100XXXXXXXX0003</div></div><div style="text-align:right"><b style="font-size:1.05rem">${v.type==='full'?'TAX INVOICE':'SIMPLIFIED TAX INVOICE'}</b><div dir="rtl" class="small muted">${v.type==='full'?'فاتورة ضريبية':'فاتورة ضريبية مبسطة'}</div>${v.no}<br>${fdl(v.date)}</div></div>

  <table><tr><th>Description</th><th class="r">Qty</th><th class="r">Rate</th><th class="r">Taxable</th><th class="r">VAT 5%</th><th class="r">Total</th></tr>${v.lines.map(l=>`<tr><td>${esc(l.desc)}</td><td class="r">${l.qty}</td><td class="r">${l.rate.toFixed(2)}</td><td class="r">${l.net.toFixed(2)}</td><td class="r">${l.vat.toFixed(2)}</td><td class="r">${l.total.toFixed(2)}</td></tr>`).join('')}</table>
  <div class="totals" style="margin:10px 0 0 auto;max-width:280px"><span>Taxable amount</span><span>${v.taxable.toFixed(2)}</span><span>VAT 5%</span><span>${v.vat.toFixed(2)}</span><span class="g">Total AED</span><span class="g">${v.total.toFixed(2)}</span><span>Advance / paid</span><span>${invPaid(v).toFixed(2)}</span><span><b>Balance due</b></span><span><b>${invDue(v).toFixed(2)}</b></span></div></div>

function paymentModal(oid){const o=ORDBY(oid);const open=INV.filter(v=>v.orderId===o.id&&invDue(v)>0.009);const f=ofig(o);const due=open.length?sum(open.map(invDue)):Math.max(0,f.balance);

function initSig(c){c.dataset.on=1;const x=c.getContext('2d');x.lineWidth=2.5;x.lineCap='round';x.strokeStyle='#1c2230';let dn=false;const pos=e=>{const r=c.getBoundingClientRect();return [(e.clientX-r.left)*c.width/r.width,(e.clientY-r.top)*c.height/r.height]};
  c.addEventListener('pointerdown',e=>{dn=true;const [a,b]=pos(e);x.beginPath();x.moveTo(a,b);c.setPointerCapture(e.pointerId);S.modal&&(S.modal.signed=true)});c.addEventListener('pointermove',e=>{if(!dn)return;const [a,b]=pos(e);x.lineTo(a,b);x.stroke()});c.addEventListener('pointerup',()=>dn=false)}

  doAssign:d=>{assignIds([d.i],document.getElementById('asgT').value)},
  doDone:d=>{const i=ITEM(d.i);const o=ORDBY(i.orderId);i.stage=SIDX(o,'check');i.hist.push({stage:i.stage,at:TODAY,by:U().staff||i.tailor||'—',entered:U().name});if(S.modal&&S.modal.k!=='custom')S.modal=null;if(S.scan.item===i.id&&!U().phone)S.modal=null;toast(`Done. Sent to ${i.master||'the master'} for checking.`);render()},
  doReady:d=>{const i=ITEM(d.i);const o=ORDBY(i.orderId);i.stage=SIDX(o,'ready');i.reworkOpen=false;i.hist.push({stage:i.stage,at:TODAY,by:U().staff||i.master||'—',entered:U().name});notify(o,'ready',TODAY);if(S.modal&&S.modal.k!=='custom')S.modal=null;toast('Ready. The customer gets a WhatsApp message.');render()},
  openRework:d=>{const i=ITEM(d.i);custom(()=>modal('<h2>Send back for rework</h2>',`<p class="small muted" style="margin:0">${esc(i.label)} · goes back to ${esc(i.tailor||'the tailor')}. Pick the reason.</p><div class="stack">${REWORK_REASONS.map(r=>`<button class="btn" style="justify-content:flex-start;padding:12px 14px" data-a="doRework" data-i="${i.id}" data-r="${esc(r)}">${esc(r)}</button>`).join('')}</div>`,`<button class="btn" data-a="close">Cancel</button>`))},
  doRework:d=>{const i=ITEM(d.i);const o=ORDBY(i.orderId);i.rework++;i.reworkOpen=true;i.reworkReason=d.r;i.stage=SIDX(o,'stitch');i.hist.push({stage:'Rework',at:TODAY,by:U().staff||'—',entered:U().name,note:d.r});S.modal=null;toast(`Back to ${i.tailor||'the tailor'} for rework. It goes to the top of their list.`);render()},
  photo:d=>{S.modal={k:'photo',i:d.i,p:+d.p,prev:S.modal&&S.modal.k!=='photo'?S.modal:null};render()},
  photoBack:()=>{S.modal=S.modal.prev;render()},
  stockRecv:()=>custom(()=>modal('<h2>Receive stock</h2>',`<div class="fgrid"><div class="field"><span>Item</span><select id="rsI">${STOCK_ITEMS.map(s=>`<option value="${s.id}">${s.name}</option>`).join('')}</select></div><div class="field"><span>Branch</span><select id="rsB">${LOC.filter(l=>U().branches.includes(l.id)).map(l=>`<option value="${l.id}">${l.name}</option>`).join('')}</select></div><div class="field"><span>Quantity received</span><input id="rsQ" type="number" value="100"></div><div class="field"><span>Supplier and delivery note</span><input id="rsR" value="Al Khaleej Textiles · GRN-0240"></div></div>`,`<button class="btn" data-a="close">Cancel</button><button class="btn pri" data-a="doStockRecv">Add to stock</button>`)),
  doStockRecv:()=>{const it=document.getElementById('rsI').value,b=document.getElementById('rsB').value,q=+document.getElementById('rsQ').value||0;if(q<=0){toast('Enter a quantity.');return}STOCK[it][b]=r2(STOCK[it][b]+q);STOCKLOG.push({at:TODAY,user:U().name,item:it,loc:b,change:q,reason:'Received from '+(document.getElementById('rsR').value||'supplier'),kind:'receive'});S.modal=null;S.stockTab='movements';toast('Stock received.');render()},
});
function assignIds(ids,t){ids.forEach(id=>{const i=ITEM(id);const o=ORDBY(i.orderId);i.tailor=t;if(['cut','wait'].includes(SKEY(i,o))){i.stage=SIDX(o,'stitch');i.hist.push({stage:i.stage,at:TODAY,by:U().staff||i.master||'—',entered:U().name,note:'Assigned to '+t})}});S.sel.clear();S.modal=null;toast(`${ids.length} garment(s) assigned to ${t}.`);render()}
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el)return;const fn=A[el.dataset.a];if(!fn)return;if(el.tagName==='A')e.preventDefault();fn(el.dataset,el,e)});
document.addEventListener('change',e=>{const el=e.target;const k=el.dataset.ch;if(el.dataset.refphoto!=null){const f=el.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const l=S.wiz.lines[+el.dataset.refphoto];(l.photos=l.photos||[]).push({src:r.result,cap:'Reference from customer'});render()};r.readAsDataURL(f);return}if(el.dataset.photo!=null){const f=el.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{S.wiz.lines[+el.dataset.photo].photo=r.result;render()};r.readAsDataURL(f);return}
  if(!k){if(el.dataset.a&&(el.type==='checkbox'||el.type==='radio'))return;return}
  const v=el.value;const w=S.wiz;
  if(k==='role'){if(USERS[v].phone)S.route=P[v].nav[0];S.role=v;S.branch='ALL';S.sel.clear();S.phTab='mine';S.ask=null;S.bulk=false;S.bulkAsk=null;S.scan={item:null,multi:false,list:[]};if(USERS[v].branches.length===1)S.branch=USERS[v].branches[0];S.modal=null;S.wiz=null;S.justCreated=null;S.custId=null;S.compId=null;if(S.route==='order'&&!canSeeOrder(ORDBY(S.orderId)))S.route='orders';if(S.route!=='review'&&S.route!=='order'&&!P[v].nav.includes(S.route))S.route='home';if(S.route==='order'&&!P[v].nav.includes('orders'))S.route='home';toast('Now signed in as '+USERS[v].name+' · '+USERS[v].role);render();return}
  if(k==='branch'){S.branch=v;render();return}
  if(k==='lineGar'){const l=w.lines[+el.dataset.k];const mem=CU(w.custId).members.find(m=>m.id===l.memberId);Object.assign(l,mtmLineFor(mem,v),{qty:l.qty,source:l.source,fabric:l.fabric});render();return}
  if(k==='lineMember'){const l=w.lines[+el.dataset.k];const mem=CU(w.custId).members.find(m=>m.id===v);Object.assign(l,mtmLineFor(mem,l.gar),{qty:l.qty,source:l.source,fabric:l.fabric});render();return}
  if(k==='lineSource'){w.lines[+el.dataset.k].source=v;render();return}
  if(k==='lineGarU'){w.lines[+el.dataset.k].gar=v;render();return}
  if(k==='wizColl'){w.collect=v;render();return} if(k==='wizAdvM'){w.advMethod=v;return} if(k==='wizMaster'){w.master=v;return} if(k==='cutF'){S.modal.fab=v;render();return}
  if(k==='itemMaster'||k==='itemTailor'){A[k](el.dataset,el);return}
  if(k in S){S[k]=v;render()}});
document.addEventListener('input',e=>{const el=e.target;if(el.dataset.qnote){const id=el.dataset.qnote;const a=S.review[id]=S.review[id]||{};a.n=el.value;saveAnswer(id);return}
  const k=el.dataset.in;if(!k)return;const w=S.wiz;const v=el.value;
  if(k==='cutM'){S.modal.m=v;render();return}
  if(k==='custQ'||k==='ordersQ'||k==='prodQ'){S[k]=v;render();return}
  if(k==='wizCustQ'){w.custQ=v;render();return}
  if(k==='line'){w.lines[+el.dataset.k][el.dataset.f]=el.dataset.f==='qty'?Math.max(1,+v||1):v;if(el.dataset.f==='qty')render();return}
  if(k==='meas'){w.lines[+el.dataset.k].meas[el.dataset.f]=v;return}
  if(k==='wizDisc'){w.discount=Math.max(0,Math.min(100,+v||0));render();return}
  if(k==='wizProm'){w.promised=v;return} if(k==='wizPO'){w.po=v;return} if(k==='wizAdv'){w.advance=v;return} if(k==='wizNotes'){w.notes=v;return}
  if(k==='ncCheck'){const hit=CUST.find(c=>c.mobile.replace(/\s/g,'')===v.replace(/\s/g,''));document.getElementById('ncDup').innerHTML=hit?`<div class="note warn">Already registered: <b>${esc(hit.name)}</b> (${bn(hit.branch)}, ${hit.members.length} family member(s)). <button class="btn sm" data-a="useExisting" data-c="${hit.id}">Use this customer</button></div>`:'';return}});
A.go_=0;A.useExisting=d=>{S.modal=null;if(S.route==='new-order'&&S.wiz){S.wiz.custId=d.c}else S.custId=d.c;render()};
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(S.modal){S.modal=null;render()}else if(S.drawer){S.drawer=false;render()}}});
function routeFromHash(){const h=(location.hash||'').slice(1);if(h&&(VIEWS[h])&&(h==='review'||P[S.role].nav.includes(h)))S.route=h}
window.addEventListener('hashchange',()=>{routeFromHash();render()});
loadLocal();routeFromHash();render();
</script>
</body></html>
